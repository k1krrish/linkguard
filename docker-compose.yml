services:
  linkguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkguard-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LINKGUARD_MAX_UPLOAD_MB=10
      - LINKGUARD_MAX_PACKETS=20000
      - LINKGUARD_ALLOW_PRIVATE_TARGETS=0
    restart: unless-stopped
